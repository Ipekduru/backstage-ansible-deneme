---
name: Ansible Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Ansible kalite kontrolleri
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Kaynak kodu indir
        uses: actions/checkout@v7

      - name: Python ortamını hazırla
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Kontrol araçlarını kur
        run: >-
          python -m pip install
          "ansible-core==2.21.2"
          "ansible-lint==26.8.0"
          "yamllint==1.38.0"

      - name: YAML biçimini kontrol et
        run: yamllint playbooks

      - name: Ansible standartlarını kontrol et
        run: ansible-lint playbooks

      - name: Playbook sözdizimini kontrol et
        shell: bash
        run: |
          mapfile -d '' playbooks < <(find playbooks -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)
          if [ "${playbooks[0]+x}" = "" ]; then
            echo "Kontrol edilecek playbook bulunamadı."
            exit 1
          fi
          for playbook in "${playbooks[@]}"; do
            ansible-playbook --inventory localhost, --connection local --syntax-check "$playbook"
          done

      - name: Gizli bilgi sızıntısını kontrol et
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1
          dir /repo --redact --exit-code 1
